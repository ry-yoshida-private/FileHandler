[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-handler"
version = "0.1.0"
description = "Lightweight file I/O utilities for structured data, text, and XML."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "ry-yoshida" }
]
dependencies = [
  "numpy",
  "h5py",
  "PyYAML",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.39",
  "pytest>=8.0",
]

[project.urls]
"Homepage" = "https://github.com/ry-yoshida/FileHandler"
"Bug Tracker" = "https://github.com/ry-yoshida/FileHandler/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
file_handler = ["py.typed"]
txt_writer = ["py.typed"]
xml_handler = ["py.typed"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
